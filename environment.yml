name: scalable_course
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # Core
  - python=3.11
  - pip
  - make
  - cmake
  - cxx-compiler
  - c-compiler
  - zlib
  - git
  - wget
  - curl
  - llvm-openmp
  # Runtime helpers (panagram + general)
  - samtools
  - htslib
  - snakemake-minimal
  - parallel
  - tabix
  - minimap2=2.31  # PAFs for impg demos
  # Bioconda course tools (pinned; versions as of 2026-09-22)
  - agc=3.2.4
  - ropebwt3=3.10
  - mumemto=1.4.1
  - shredtools=0.1.0
  - impg=0.5.0
  - bandage_ng=2026.9.1
  - panacus=0.5.3
  # GENESPACE system deps (OrthoFinder must be 2.5.x — 3.x is incompatible)
  - orthofinder=2.5.5
  - mcscanx=1.0.0
  # k-mer / assembly QC / sketching
  # genomescope2: install from GitHub (bioconda 2.1.0 is py313-only)
  - r-base>=4.3,<4.5
  - r-argparse
  - r-minpack.lm
  - r-jsonlite
  - r-remotes
  # GENESPACE R deps
  - r-data.table
  - r-dbscan
  - r-r.utils
  - r-igraph
  - r-ggplot2
  - bioconductor-biostrings
  - bioconductor-rtracklayer
  # SVbyEye R deps
  - r-ggforce
  - r-gggenes
  - r-ggnewscale
  - r-dplyr
  - r-stringr
  - r-magrittr
  - r-tibble
  - r-scales
  - r-wesanderson
  - r-randomcolor
  - bioconductor-s4vectors
  - bioconductor-genomicranges
  - bioconductor-genomicalignments
  - bioconductor-iranges
  - bioconductor-genomeinfodb
  - bioconductor-bsgenome
  - bioconductor-rsamtools
  - fastk=1.2
  - merquryfk=1.2
  - sourmash=4.9.4
  # Gene Myers aligners (bioconda matches GitHub latest)
  - fastga=1.5.20260729
  - fastan=0.8
  # vg=1.76.1 is linux-only on bioconda; installed in the Dockerfile for the course image
